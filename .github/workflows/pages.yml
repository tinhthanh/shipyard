# The fork's one-line installers, at https://tinhthanh.github.io/shipyard/:
#   install.ps1      the Windows app        irm …/install.ps1 | iex
#   install-cli.sh   berth on macOS, Linux  curl -fsSL …/install-cli.sh | sh
#   install.sh       berthd on a box        curl -fsSL …/install.sh | sh
# Each fetches the latest release when it runs, so a release needs no deploy;
# this runs when the scripts change.
name: pages

on:
  push:
    branches: [main]
    paths:
      - scripts/install.ps1
      - scripts/install-cli.sh
      - site/install.sh
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - scripts/install.ps1
      - scripts/install-cli.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the scripts
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
      - run: shellcheck scripts/install-cli.sh && sh -n scripts/install-cli.sh && dash -n scripts/install-cli.sh
      - name: Build the site
        env:
          REPO: ${{ github.repository }}
        run: |
          base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO#*/}"
          mkdir _site
          cp scripts/install.ps1 scripts/install-cli.sh _site/
          # install.sh as the release has it (fork-release.yml), with this
          # site's address in the commands it prints.
          sed -e "s#^repo=\"cosscom/shipyard\"#repo=\"$REPO\"#" -e "s#github.com/cosscom/shipyard/#github.com/$REPO/#" \
            -e "s#https://berthd.app/install#$base/install.sh#g" site/install.sh >_site/install.sh
          grep -q "^repo=\"$REPO\"$" _site/install.sh
          sh -n _site/install.sh
          cat >_site/index.html <<EOF
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Install Vetgo</title>
          <style>body{font:16px/1.5 system-ui,sans-serif;max-width:46rem;margin:2rem auto;padding:0 16px;color:#1b1b1b;background:#fff}
          pre{background:#f4f4f4;padding:.75rem 1rem;border-radius:6px;overflow-x:auto}
          @media (prefers-color-scheme:dark){body{color:#e8e8e8;background:#141414}pre{background:#242424}a{color:#8ab4f8}}</style></head>
          <body><h1>Install Vetgo</h1>
          <p>Windows app (PowerShell):</p><pre>irm $base/install.ps1 | iex</pre>
          <p>The berth command on macOS or Linux:</p><pre>curl -fsSL $base/install-cli.sh | sh</pre>
          <p>A box (berthd, on the server):</p><pre>curl -fsSL $base/install.sh | sh</pre>
          <p>Each installs the latest release, checked against its sha256. Source and other ways to install:
          <a href="https://github.com/$REPO">github.com/$REPO</a>.</p></body></html>
          EOF
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
