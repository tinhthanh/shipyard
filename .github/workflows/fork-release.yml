name: fork-release

# The fork's releases, in place of release.yml (upstream's, kept as upstream
# has it and turned off in this repository: its tags would start both). A
# vX.Y.Z-fork.N tag builds berthd and berth for every platform install.sh and
# the CLI support, as release.yml's release job does, and attaches the
# archives, checksums.txt and install.sh, with this repository in place of
# upstream's, so `curl -fsSL …/releases/latest/download/install.sh | sh`
# installs this fork's berthd. The windows job adds the Windows app (an
# alpha, under the Vetgo brand): its installer, signed with the fork's
# updater key (secrets FORK_UPDATER_KEY and FORK_UPDATER_KEY_PASSWORD, whose
# public half is in app/src-tauri/tauri.fork.conf.json), and latest.json,
# the feed installed Windows apps update from. The Mac and Linux apps are
# built from source and find nothing for them in it (lib/fork-updates.ts).
# The release stays a draft until all of CI (ci.yml) passes on the tag and
# the Windows app is on it.
on:
  push:
    tags: ["v*-fork.*"]

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  # Shipyard's static tmux for Linux boxes, as in release.yml.
  tmux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            bin/tmux-linux-amd64
            bin/tmux-linux-arm64
          key: tmux-${{ hashFiles('scripts/build-tmux.sh') }}
      - run: scripts/build-tmux.sh bin amd64 arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tmux
          path: |
            bin/tmux-linux-amd64
            bin/tmux-linux-arm64
          if-no-files-found: error

  release:
    needs: [tmux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tmux
          path: bin
      - run: chmod +x bin/tmux-linux-amd64 bin/tmux-linux-arm64
      - name: Build archives
        run: make release VERSION="$GITHUB_REF_NAME"
      - name: Check the stamped version
        run: |
          tar -xzf dist/berthd-linux-amd64.tar.gz -C "$RUNNER_TEMP" berthd
          "$RUNNER_TEMP/berthd" version | tee /dev/stderr | grep -q "^berthd $GITHUB_REF_NAME "
      - name: install.sh for this repository
        env:
          REPO: ${{ github.repository }}
        run: |
          # Its own repository, and its own address in the commands it prints.
          sed -e "s#^repo=\"cosscom/shipyard\"#repo=\"$REPO\"#" -e "s#github.com/cosscom/shipyard/#github.com/$REPO/#" \
            -e "s#https://berthd.app/install#https://github.com/$REPO/releases/latest/download/install.sh#g" site/install.sh >dist/install.sh
          grep -q "^repo=\"$REPO\"$" dist/install.sh
          sh -n dist/install.sh
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt dist/install.sh --clobber
          else
            gh release create "$TAG" dist/*.tar.gz dist/checksums.txt dist/install.sh --verify-tag --draft --title "Shipyard $TAG" --generate-notes
          fi

  windows:
    needs: [release]
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.FORK_UPDATER_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.FORK_UPDATER_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "FORK_UPDATER_KEY is not set: the installer would not be signed for the updater" }
          $version = $env:TAG.TrimStart("v")
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows-app-build.ps1 -Version $version -Brand vetgo
          if ($LASTEXITCODE) { throw "the Windows build failed" }
      - name: The installer and its feed
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # No version in the asset's name, as upstream's: the feed names
          # this release's copy.
          $nsis = "app\src-tauri\target\release\bundle\nsis"
          $exe = Get-ChildItem $nsis -Filter "*-setup.exe" | Select-Object -First 1
          $sig = Get-Item "$($exe.FullName).sig"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe.FullName "dist\Vetgo-windows-x64-setup.exe"
          Copy-Item $sig.FullName "dist\Vetgo-windows-x64-setup.exe.sig"
          $feed = [ordered]@{
            version   = $env:TAG.TrimStart("v")
            notes     = "https://github.com/$env:REPO/releases/tag/$env:TAG"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sig.FullName -Raw).Trim()
                url       = "https://github.com/$env:REPO/releases/download/$env:TAG/Vetgo-windows-x64-setup.exe"
              }
            }
          }
          $feed | ConvertTo-Json -Depth 5 | Set-Content -Path dist\latest.json -Encoding utf8NoBOM
          Get-Content dist\latest.json
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The feed last, so it never names an installer that isn't there.
          gh release upload "$TAG" dist/Vetgo-windows-x64-setup.exe dist/Vetgo-windows-x64-setup.exe.sig --clobber
          gh release upload "$TAG" dist/latest.json --clobber

  publish:
    # Only once CI passed on the tag and the Windows app is on the release:
    # until then it is a draft, which releases/latest/download/ never serves.
    needs: [checks, release, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest
